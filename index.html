<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Neonowy Reaktor — responsywny fliper z misjami, sterowaniem dotykowym i klawiaturą."><title>Neonowy Reaktor</title><style>:root{--accent:#31f6d0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#172637,#050912 75%);font-family:Arial,sans-serif;color:#fff;touch-action:none}#frame{position:relative;flex:none;width:379px;height:543px}#game{position:absolute;width:379px;height:543px;transform-origin:top left;background:#0b131e;border:1px solid #34404e;border-radius:18px;overflow:hidden;box-shadow:0 20px 70px #0009;user-select:none}header{height:61px;padding:10px 15px 7px;background:linear-gradient(110deg,#182231,#0b131e);display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:8px;letter-spacing:2px;color:var(--accent);margin-bottom:4px}h1{font-size:19px;letter-spacing:-.4px;margin:0}#score{font-size:21px;font-weight:bold;font-variant-numeric:tabular-nums;color:var(--accent);text-align:right}#best{font-size:8px;color:#a7b5c4;margin-top:3px}canvas{display:block;width:379px;height:408px}footer{position:absolute;bottom:0;height:73px;width:100%;background:#111b28;border-top:1px solid #324151;padding:7px 10px}.row{display:flex;gap:6px;height:35px}button{border:1px solid #435162;background:#202f40;border-radius:9px;color:white;font-weight:bold;cursor:pointer;touch-action:none;font-size:11px}button:focus-visible{outline:2px solid white}button:active,.held{background:#3c5770}#left,#right{width:79px;font-size:16px;color:var(--accent)}#launch{flex:1;background:var(--accent);color:#101b24;border:0}#pause{width:33px}#reset{width:30px}.hint{font-size:8px;color:#a1afbf;text-align:center;margin-top:7px;letter-spacing:.3px}#overlay{position:absolute;top:128px;left:35px;width:307px;text-align:center;padding:23px 20px;background:#0a1424ed;backdrop-filter:blur(7px);border:1px solid #627388;border-radius:17px;box-shadow:0 18px 35px #0009}#overlay h2{font-size:24px;margin:4px 0 12px}#overlay p{color:#c4d4e4;line-height:1.6;font-size:12px;margin:10px 0 18px}#overlay button{background:var(--accent);color:#0c1822;padding:12px 24px;border:0;font-size:13px}#overlay .badge{color:var(--accent);font-size:10px;letter-spacing:3px}</style></head><body><main id="frame"><section id="game" aria-label="Neonowy Reaktor"><header><div><div class="eyebrow">PINBALL / CYBER CITY</div><h1>Neonowy Reaktor</h1></div><div><div id="score">000000</div><div id="best">REKORD 0</div></div></header><canvas width="758" height="816" aria-label="Plansza flipera, steruj przyciskami poniżej"></canvas><footer><div class="row"><button id="left" aria-label="Lewa łapka">◀</button><button id="launch">WYSTRZEL</button><button id="right" aria-label="Prawa łapka">▶</button><button id="pause" aria-label="Pauza">Ⅱ</button><button id="reset" aria-label="Reset gry i rekordu">↺</button></div><div class="hint">← → / A D · ŁAPKI &nbsp; SPACJA · START &nbsp; P · PAUZA</div></footer><div id="overlay"><div class="badge">⚡ ARCADE PINBALL ⚡</div><h2></h2><p></p><button>ROZPOCZNIJ</button><button id="cancel-reset" hidden style="margin-left:8px;background:#314359;color:white">ANULUJ</button></div></section></main><script>const CFG={"slug": "neonowy-reaktor", "name": "Neonowy Reaktor", "tag": "PINBALL / CYBER CITY", "color": "#31f6d0", "second": "#ff4fbb", "bg": "#081b25", "symbol": "⚡", "mission": "Naładuj 3 rdzenie", "labels": ["A", "B", "C"], "bumpers": [[109, 126, 23], [244, 126, 23], [177, 192, 26]], "rails": [[47, 226, 102, 285], [307, 226, 252, 285]], "targets": [[82, 59], [177, 48], [271, 59]], "goal": "Traf trzy rdzenie, by uruchomić reaktor."};
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
ctx.scale(2,2);
const $=s=>document.querySelector(s),PI=Math.PI;
let phase='ready',score=0,best=0,lives=3,missions=0,lit=[false,false,false],ball=null,particles=[],toast='',toastTime=0,left=false,right=false,la=.46,ra=PI-.46,oldLa=la,oldRa=ra,bumperGlow=[0,0,0,0],clock=0,last=0,charge=0,combo=0,comboTime=0;
const storageKey='pinball-v1-'+CFG.slug;try{best=+localStorage.getItem(storageKey)||0}catch(e){}
const bumpers=CFG.bumpers.map(b=>({x:b[0],y:b[1],r:b[2]}));
const targets=CFG.targets.map(p=>({x:p[0],y:p[1],r:12}));
const rails=[[22,28,22,285],[22,285,88,340],[329,285,265,340],[329,70,329,285],...CFG.rails];
function hud(){ $('#score').textContent=String(score).padStart(6,'0');$('#best').textContent='REKORD '+best.toLocaleString('pl-PL');$('#launch').textContent=phase==='ready'?'WYSTRZEL':phase==='over'||phase==='won'?'NOWA GRA':'WYSTRZEL';$('#pause').textContent=phase==='paused'?'▶':'Ⅱ';$('#pause').setAttribute('aria-label',phase==='paused'?'Wznów grę':'Pauza');}
function record(){if(score>best){best=score;try{localStorage.setItem(storageKey,best)}catch(e){}}}
function say(t){toast=t;toastTime=2.1}
function add(n,x,y){score+=n;record();hud();for(let i=0;i<8;i++)particles.push({x,y,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,t:.45});}
function serve(){ball={x:350,y:354,vx:0,vy:0,r:6,shoot:true,cool:0};phase='ready';hud()}
function reset(){score=0;lives=3;missions=0;lit=[false,false,false];particles=[];combo=0;la=.46;ra=PI-.46;$('#overlay').hidden=true;serve();say(CFG.mission)}
function launch(){if(phase==='intro'||phase==='over'||phase==='won'){reset();return}if(phase==='paused')return;if(phase==='ready'){phase='play';ball.vy=-780;charge=0;say('Powodzenia!');hud()}}
function overlay(title,text,button){$('#cancel-reset').hidden=true;delete $('#overlay button').dataset.reset;$('#overlay').hidden=false;$('#overlay h2').textContent=title;$('#overlay p').textContent=text;$('#overlay button').textContent=button}
function pause(){if($('#overlay button').dataset.reset==='yes'){cancelReset();return;}if(phase==='play'||phase==='ready'){phaseBeforePause=phase;phase='paused';left=right=false;overlay('Pauza','Odpocznij chwilę. Wynik i bile czekają na Ciebie.','WRÓĆ DO GRY')}else if(phase==='paused'){phase=phaseBeforePause;$('#overlay').hidden=true}hud()}
let phaseBeforePause='ready',resetSnapshot=null;
function contactSegment(ax,ay,bx,by,radius=0,flipper=false,angSpeed=0,pivotX=0){let dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((ball.x-ax)*dx+(ball.y-ay)*dy)/(dx*dx+dy*dy))),px=ax+t*dx,py=ay+t*dy,nx=ball.x-px,ny=ball.y-py,d=Math.hypot(nx,ny),rr=ball.r+radius;if(d>=rr)return; if(d<.001){nx=0;ny=-1;d=1} else{nx/=d;ny/=d}ball.x=px+nx*(rr+.1);ball.y=py+ny*(rr+.1);let svx=0,svy=0;if(flipper){svx=-angSpeed*(py-ay);svy=angSpeed*(px-ax)}const vn=(ball.vx-svx)*nx+(ball.vy-svy)*ny;if(vn<0){ball.vx-=1.78*vn*nx;ball.vy-=1.78*vn*ny;if(flipper&&Math.abs(angSpeed)>1&&ny<.6){ball.vy=Math.min(ball.vy,-410-120*t);ball.vx+=(177-ball.x)*1.9}}}
function update(dt){if(phase==='paused'||phase==='intro'||phase==='over'||phase==='won')return;clock+=dt;toastTime=Math.max(0,toastTime-dt);for(let i=0;i<bumperGlow.length;i++)bumperGlow[i]=Math.max(0,bumperGlow[i]-dt*3);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}particles=particles.filter(p=>p.t>0);
oldLa=la;oldRa=ra;la+=( (left?-.43:.46)-la)*Math.min(1,dt*25);ra+=((right?PI+.43:PI-.46)-ra)*Math.min(1,dt*25);
if(phase!=='play')return;ball.cool=Math.max(0,ball.cool-dt);comboTime-=dt;if(comboTime<=0)combo=0;ball.vy+=590*dt;ball.vx*=Math.pow(.997,dt*120);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
if(ball.shoot){if(ball.y<29){ball.shoot=false;ball.x=313;ball.y=29;ball.vx=-210;ball.vy=90}return}
if(ball.y<17){ball.y=17;ball.vy=Math.abs(ball.vy)*.82}if(ball.x<28){ball.x=28;ball.vx=Math.abs(ball.vx)*.85}if(ball.x>323){ball.x=323;ball.vx=-Math.abs(ball.vx)*.85}
for(const r of rails)contactSegment(...r,3);
contactSegment(91,340,91+65*Math.cos(la),340+65*Math.sin(la),7,true,(la-oldLa)/dt,91);
contactSegment(264,340,264+65*Math.cos(ra),340+65*Math.sin(ra),7,true,(ra-oldRa)/dt,264);
for(let i=0;i<bumpers.length;i++){const b=bumpers[i];let dx=ball.x-b.x,dy=ball.y-b.y,d=Math.hypot(dx,dy),r=b.r+ball.r;if(d<r){if(d<.01){dx=1;dy=0;d=1}ball.x=b.x+dx/d*(r+.5);ball.y=b.y+dy/d*(r+.5);let dot=ball.vx*dx/d+ball.vy*dy/d;if(dot<0){ball.vx-=2*dot*dx/d;ball.vy-=2*dot*dy/d}ball.vx+=dx/d*115;ball.vy+=dy/d*115;bumperGlow[i]=1;combo=Math.min(combo+1,5);comboTime=2;add(100*combo,b.x,b.y)}}
for(let i=0;i<targets.length;i++){const t=targets[i],dx=ball.x-t.x,dy=ball.y-t.y,d=Math.hypot(dx,dy),r=t.r+ball.r;if(d<r&&d>.01){ball.x=t.x+dx/d*(r+.3);ball.y=t.y+dy/d*(r+.3);const dot=ball.vx*dx/d+ball.vy*dy/d;if(dot<0){ball.vx-=1.9*dot*dx/d;ball.vy-=1.9*dot*dy/d}if(!lit[i]){lit[i]=true;add(500,t.x,t.y);say(CFG.mission+' · '+lit.filter(Boolean).length+'/3');if(lit.every(Boolean)){missions++;add(2500,177,180);lit=[false,false,false];say('MISJA '+missions+'/3 · BONUS +2500');if(missions>=3){phase='won';overlay('Mistrz stołu!','Trzy misje ukończone! Twój wynik: '+score+' punktów. Spróbuj pobić rekord.','ZAGRAJ PONOWNIE');hud()}}}}}
// The orbiting satellite is a moving bumper unique to the space table.
if(CFG.slug==='kosmiczna-orbita'){let sx=178+50*Math.cos(clock*1.2),sy=155+32*Math.sin(clock*1.2),dx=ball.x-sx,dy=ball.y-sy,d=Math.hypot(dx,dy);if(d<17&&d>.01&&ball.cool<=0){ball.vx=dx/d*330;ball.vy=dy/d*330;ball.cool=.2;add(250,sx,sy)}}
// Pirate treasure lane rewards a crossing; neon reactor adds a central energy gate.
if(CFG.slug!=='kosmiczna-orbita'&&ball.cool<=0&&Math.abs(ball.y-261)<6&&ball.x>145&&ball.x<210){ball.cool=.6;add(CFG.slug==='zatoka-skarbow'?300:200,ball.x,ball.y);say(CFG.slug==='zatoka-skarbow'?'SKARB +300':'ENERGIA +200')}
let speed=Math.hypot(ball.vx,ball.vy);if(speed>900){ball.vx*=900/speed;ball.vy*=900/speed}
if(ball.y>417){lives--;combo=0;if(lives<=0){phase='over';record();overlay('Koniec gry','Twój wynik: '+score+' punktów. Ukończone misje: '+missions+'/3. Jeszcze jedna próba?','ZAGRAJ PONOWNIE');hud()}else{serve();say('Pozostałe bile: '+lives)}}}
function round(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function line(x,y,xx,yy,col,width=2){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.strokeStyle=col;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke()}
function circle(x,y,r,fill,stroke,width=1){ctx.beginPath();ctx.arc(x,y,r,0,PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function txt(t,x,y,size,col,align='center'){ctx.fillStyle=col;ctx.font=`bold ${size}px Arial`;ctx.textAlign=align;ctx.fillText(t,x,y)}
function draw(){ctx.clearRect(0,0,379,408);let g=ctx.createLinearGradient(0,0,379,408);g.addColorStop(0,CFG.bg);g.addColorStop(1,'#060d18');ctx.fillStyle=g;ctx.fillRect(0,0,379,408);
for(let i=0;i<65;i++){let x=(i*83+17)%320+18,y=(i*59+7)%363+15;circle(x,y,i%4===0?1.2:.6,CFG.color+'37')}
ctx.save();ctx.beginPath();ctx.roundRect(19,10,312,383,[45,45,18,18]);ctx.clip();
if(CFG.slug==='neonowy-reaktor'){for(let x=25;x<330;x+=22)line(x,25,x,390,CFG.color+'0c',1);for(let y=24;y<400;y+=22)line(20,y,332,y,CFG.color+'0c',1);for(let i=0;i<3;i++){line(45+i*113,80,45+i*113,192,CFG.color+'22');line(45+i*113,192,65+i*113,212,CFG.color+'22')}}
else if(CFG.slug==='zatoka-skarbow'){for(let y=100;y<380;y+=22){ctx.beginPath();for(let x=20;x<335;x+=2){const yy=y+Math.sin(x/24+y)*4;if(x===20)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.strokeStyle='#4ac7be12';ctx.stroke()}circle(177,179,64,null,'#ffcf6e12',2);line(177,128,177,230,'#ffcf6e18');line(126,179,228,179,'#ffcf6e18');txt('N',177,141,10,'#ffcf6e44');}
else{ctx.save();ctx.translate(178,155);ctx.rotate(-.35);ctx.scale(1,.64);circle(0,0,93,null,'#aaaaff22',1);circle(0,0,62,null,'#aaaaff25',1);ctx.restore();for(let i=0;i<8;i++)circle(50+i*34,48+i*37%279,1.4,'#f2f6ff88')}
ctx.restore();
round(337,12,27,389,13,'#172331','#43576b');line(350,24,350,325,'#758799',1);for(let y=365;y<390;y+=4)line(343,y,357,y,'#708496',1);txt('↑',350,341,22,CFG.color);
ctx.shadowColor=CFG.color;ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(22,285);ctx.lineTo(22,49);ctx.quadraticCurveTo(22,13,61,13);ctx.lineTo(293,13);ctx.quadraticCurveTo(329,13,329,49);ctx.lineTo(329,285);ctx.strokeStyle=CFG.color;ctx.lineWidth=3;ctx.stroke();ctx.shadowBlur=0;
for(const r of rails){line(...r,'#102330',10);line(...r,CFG.color+'a0',3);line(r[0],r[1]-1,r[2],r[3]-1,'#efffff66',1)}
for(let i=0;i<targets.length;i++){let t=targets[i];circle(t.x,t.y,17,CFG.color+'0e',CFG.color+'55');circle(t.x,t.y,12,lit[i]?CFG.color:'#1a2a3c',CFG.color,2);txt(CFG.labels[i],t.x,t.y+4,10,lit[i]?'#081420':CFG.color)}
for(let i=0;i<bumpers.length;i++){let b=bumpers[i],gl=bumperGlow[i]||0;ctx.shadowColor=CFG.second;ctx.shadowBlur=10+gl*20;circle(b.x,b.y,b.r+5,CFG.second+'0c',CFG.second+'66',2);ctx.shadowBlur=0;let bg=ctx.createRadialGradient(b.x-7,b.y-8,1,b.x,b.y,b.r);bg.addColorStop(0,gl?'#fff':CFG.second);bg.addColorStop(1,CFG.bg);circle(b.x,b.y,b.r,bg,CFG.second,2);circle(b.x,b.y,b.r-7,null,'#ffffff44');txt(CFG.slug==='neonowy-reaktor'?'ϟ':CFG.slug==='zatoka-skarbow'?'◆':'✦',b.x,b.y+7,22,'#eaffff');}
if(CFG.slug==='kosmiczna-orbita'){circle(178+50*Math.cos(clock*1.2),155+32*Math.sin(clock*1.2),11,'#e7f5ff',CFG.color,2);txt('+',178+50*Math.cos(clock*1.2),159+32*Math.sin(clock*1.2),12,'#615c90')}
else{round(142,249,70,25,6,CFG.color+'12',CFG.color+'88');txt(CFG.slug==='zatoka-skarbow'?'SKARB':'ENERGIA',177,265,9,CFG.color)}
// Lower slingshots and illuminated flipper mechanism.
for(const rightSide of [false,true]){ctx.save();if(rightSide){ctx.translate(355,0);ctx.scale(-1,1)}ctx.beginPath();ctx.moveTo(46,279);ctx.lineTo(96,313);ctx.lineTo(94,330);ctx.closePath();ctx.fillStyle=CFG.second+'28';ctx.fill();ctx.strokeStyle=CFG.second;ctx.lineWidth=2;ctx.stroke();line(37,319,80,353,'#7994a477',3);circle(91,340,13,'#203548',CFG.color+'66');ctx.restore()}
function flip(x,a){let ex=x+65*Math.cos(a),ey=340+65*Math.sin(a);ctx.shadowColor=CFG.color;ctx.shadowBlur=9;line(x,340,ex,ey,CFG.color,14);ctx.shadowBlur=0;line(x,337,ex,ey-3,'#ffffff8f',3);circle(x,340,5,'#203040','#efffff',1)}flip(91,la);flip(264,ra);
txt('MISJE '+missions+'/3',177,301,9,'#dbe5ed88');txt('BILE '+('● '.repeat(lives)).trim(),54,383,9,CFG.color,'left');txt('COMBO ×'+Math.max(1,combo),303,383,9,CFG.second,'right');
if(ball){ctx.shadowColor='#fff';ctx.shadowBlur=9;let b=ctx.createRadialGradient(ball.x-2,ball.y-2,.4,ball.x,ball.y,6);b.addColorStop(0,'#fff');b.addColorStop(.35,'#d8e6ed');b.addColorStop(1,'#53667a');circle(ball.x,ball.y,6,b,'#fff',.5);ctx.shadowBlur=0}
for(const p of particles){ctx.globalAlpha=Math.max(0,p.t*2);circle(p.x,p.y,2,CFG.color)}ctx.globalAlpha=1;
if(toastTime>0){round(48,17,253,21,8,'#071321e8',CFG.color+'55');txt(toast,174,31,10,CFG.color)}else{txt(CFG.mission.toUpperCase(),176,31,8,'#c8dbe0aa')}
}
function loop(t){let dt=Math.min((t-last)/1000||0,1/30);last=t;let n=Math.max(1,Math.ceil(dt/(1/240)));for(let i=0;i<n;i++)update(dt/n);draw();requestAnimationFrame(loop)}
function hold(sel,side){let b=$(sel);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(side==='left')left=true;else right=true;b.classList.add('held')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(side==='left')left=false;else right=false;b.classList.remove('held')})}hold('#left','left');hold('#right','right');
$('#launch').onclick=launch;$('#pause').onclick=pause;$('#reset').onclick=()=>{if($('#overlay button').dataset.reset==='yes')return;resetSnapshot={phase,phaseBeforePause,hidden:$('#overlay').hidden,title:$('#overlay h2').textContent,text:$('#overlay p').textContent,button:$('#overlay button').textContent};phase='paused';overlay('Reset gry i rekordu?','Ta operacja skasuje rekord zapisany dla tego stołu. Wybierz „Resetuj”, aby zacząć od zera.','RESETUJ');$('#overlay button').dataset.reset='yes';$('#cancel-reset').hidden=false;hud()};
function cancelReset(){if(!resetSnapshot)return;const prior=resetSnapshot;phase=prior.phase;phaseBeforePause=prior.phaseBeforePause;overlay(prior.title,prior.text,prior.button);$('#overlay').hidden=prior.hidden;resetSnapshot=null;hud()}
$('#cancel-reset').onclick=cancelReset;
$('#overlay button').onclick=()=>{if($('#overlay button').dataset.reset==='yes'){delete $('#overlay button').dataset.reset;best=0;try{localStorage.removeItem(storageKey)}catch(e){}reset()}else if(phase==='paused')pause();else reset()};
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD','KeyP','Escape'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')left=true;if(e.code==='ArrowRight'||e.code==='KeyD')right=true;if(!e.repeat&&e.code==='Space')launch();if(!e.repeat&&(e.code==='KeyP'||e.code==='Escape'))pause()});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')left=false;if(e.code==='ArrowRight'||e.code==='KeyD')right=false});window.addEventListener('blur',()=>{left=right=false;if(phase==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='play')pause()});
function resize(){const s=Math.min(1,window.innerWidth/379,window.innerHeight/543);$('#frame').style.width=379*s+'px';$('#frame').style.height=543*s+'px';$('#game').style.transform=`scale(${s})`}window.addEventListener('resize',resize);resize();
reset();phase='intro';overlay(CFG.name,CFG.goal+' Ukończ 3 misje. Masz 3 bile. Łap piłkę łapkami i walcz o rekord!','ROZPOCZNIJ');hud();requestAnimationFrame(loop);
</script></body></html>
